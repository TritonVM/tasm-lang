on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

name: Rust

jobs:
  runner-matrix:
    name: format, lint, test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # The compiler's front-end links against `rustc`'s internal crates, so it
      # needs the nightly toolchain and the `rustc-dev` component declared in
      # `rust-toolchain.toml`. Installing the toolchain that file names is all
      # that is needed -- do *not* install a different one and `override` it.
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # `rustc`'s shared libraries live in the toolchain's sysroot. On Unix,
      # `build.rs` puts that directory into the built binaries' rpath. Windows
      # has no rpath, so the DLLs must be found through `PATH` instead.
      - name: Make rustc's DLLs findable (Windows)
        if: runner.os == 'Windows'
        run: echo "$(rustc --print sysroot)\bin" >> $env:GITHUB_PATH

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run cargo test without benches
        run: cargo test -- --skip benches
